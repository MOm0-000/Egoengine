schema_version: 1
objective_id: taco_brush_local_tracking_pickup_proxy_v1
status: resolved_local_unpublished
paper_faithful: false
provenance: >-
  Controlled Brush fallback objective. The 1.2 rad rotation scale is the
  paper-reported Brush example; the 0.12 m position scale and auxiliary
  coefficients are disclosed local choices because EgoEngine does not publish
  the Brush position weight/boundary or TACO contact/lift coefficients. Final
  acceptance is an independent CPU contact-and-pickup gate, not this proxy.
tracking:
  lambda_p: 69.44444444444444
  lambda_R: 0.6944444444444444
  C: 1.0
  metric_name: local_brush_normalized_ellipse_score
  position_scale_m: 0.12
  rotation_scale_rad: 1.2
  boundary_source: local_position_scale_plus_paper_brush_rotation_example
diagnostics:
  independent_thresholds:
    position_m: 0.12
    rotation_rad: 1.2
    interpretation: local diagnostic only; not an author-recovered weighted boundary
contact:
  coefficient: 0.25
  reduction: mean_over_hands_and_tracked_objects
  provenance: local optimization auxiliary; not used by final acceptance
lift:
  coefficient: 0.1
  object_role: tool
  provenance: local tool-lift auxiliary; final gate independently requires both objects
aggregation:
  tool_only: single_object
  tool_and_target: mean_reward_any_termination
evaluation:
  auxiliary_rewards: false
  strict_pickup_gate_is_separate: true

