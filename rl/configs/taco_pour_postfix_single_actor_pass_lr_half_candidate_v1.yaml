  interpretation: >-
    A one-step binary translation oracle extends the frozen actor to 36/40.
    Reversing each final OFF decision separately does not survive endpoint 57:
    the earlier reversals fail even sooner, while source 55 changes the
    source-56 bowl pose and contact but still cannot make endpoint 57
    feasible. Position and rotation are reported separately; no mixed
    position-plus-quaternion norm is interpreted as a metric distance. The
    Source-56 semantic suppression alone fails endpoint 57. A tail semantic
    oracle over sources 44--55 then produces a recoverable source-56 state and
    passes endpoint 57 with all seven candidates, but fails endpoint 58 and
    reaches only 37/40. Exact margin analysis shows measurable extra complete-
    wrist benefit at sources 44--45, while several later broader-mode winners
    are exact or near ties and do not establish distinct finger or bilateral
    causality. The 56--57 transition lags the reference mainly on z; the
    57--58 failure combines y/z position growth with a sharp loss of pinky
    normal force. Holding the source-56 wrist rotation, fingers, both, or the
    whole right-hand residual at source 57 does not pass endpoint 58. Even
    translation OFF retains strong pinky force but still fails, so temporal
    consistency and contact force alone are insufficient. The one
    predeclared unit-gain object-position-lag correction improves score to
    1.017898 but still fails; its z request also exceeds and is projected to
    the existing state-feasible action bound. No gain or axis sweep is
    authorized. Gate A subsequently found no source57 three-step solution in
    the finite current-support, rho<=3 world-translation, or reference-object-
    frame CEM candidate sets. These negative finite searches are not proofs of
    mathematical infeasibility, but they require a separate active-corrective-
    parameterization design before Gate B, Gate C or Gate D. This historical
    LR candidate remains frozen and unauthorized.

