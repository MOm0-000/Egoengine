paper_faithful: false
classification: local_progressive_chunk_execution
purpose: >-
  Continue only from a formally promoted physics boundary. Replay is always
  tried first with zero residual and no Candidate-D policy or recurrent state.
  A passing 40-interval lookahead commits only the first 20 intervals.

