  mode: Replay_zero_residual
  source_endpoint: 40
  lookahead_endpoint: 80
  commit_target_endpoint: 60
  validation_intervals: 40
  committed_intervals_if_pass: 20
  strict_success_requires: 40_of_40
  candidate_D_policy_allowed: false
  RNN_state_allowed: false
  lookahead_commit_allowed: false
  failure_action: fresh_candidate_D_chunk_local_solve_required

