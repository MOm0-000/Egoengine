    - {name: 300k, epoch: 188, physics_steps: 300800}
    - {name: 400k, epoch: 250, physics_steps: 400000}
  first_fixed_milestone_40_of_40_action: stop_and_request_promotion
  maximum_physics_steps_per_restart: 400000
  restart_seed_order: [0, 1, 2]
  non_strict_checkpoint_selection_allowed: false
  LR_schedule_allowed: false

