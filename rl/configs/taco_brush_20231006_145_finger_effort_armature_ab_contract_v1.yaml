  outcome_endpoint: 8
  original_control_hz: 30.0
  physics_timestep_s: 0.002

fixed_conditions:
  - safe_entry_mink_reference
  - isolated_natural_seating_initial_object_state
  - linear_substep_position_targets
  - wrist_gravity_and_reference_velocity_feedforward
  - support_plane
