schema: taco_pour_endpoint60_viability_adjudication_v1
status: authorized_read_only_adjudication
base_git_commit: 76f88b2614768369f9818e9b127bab1ef9e51035
paper_faithful: false
purpose: >-
  Distinguish previous-policy carryover, one-step action viability, and
  endpoint60 arrival-state viability without training or changing any task,
  policy, action, reward, observation, or physics contract.

runtime:
  backend: CPU_MuJoCo_Warp
  training_allowed: false
  optimizer_updates_policy: false
  reward_changed: false
  observation_changed: false
  action_changed: false
  action_scale_changed: false
  action_support_changed: false
  physics_changed: false
  LR_changed: false
  endpoint40_to60_chunk_commit_allowed: false

carryover:
  candidate: D
  source_solver_endpoint: 20
  seed: 2
  epoch: 125
  initial_RNN: zero
  deterministic_policy: true
  required_historical_bitwise_endpoints: [21, 60]
  continuous_rollout_endpoints: [21, 80]
  RNN_reset_at_endpoint40_or60: false
  strict_window_source: 40
  strict_window_intervals: 40

known_endpoint60_boundaries:
  A: {lineage: source40_candidate_D_seed0_epoch125, teacher_seed: 0}
  B: {lineage: source40_candidate_D_seed1_epoch125, teacher_seed: 1}
  P: {lineage: promoted_source20_candidate_D_seed2_epoch125_continuation, teacher_seed: 2}
  reference_or_GT_state_injection: false

historical_source60_audit:
  simulation_steps: 0
  source_endpoint: 60
  tail_world_mapping: {world2: A, world3: B}
  epochs: [63, 125]
  seeds: [0, 1, 2]
  distributions: [min, p01, p05, median, p95, max]
  best_score_minus_boundary: true
  best_sampled_action_saved: true
  logger_limitation: >-
    v6 visitation stores score, position/rotation errors, actions and contact
    flags, but not per-sample lift or total reward. C-e and contact bonus are
    reconstructed exactly; lift and total reward must remain unavailable
    rather than being joined from a differently ordered artifact.

one_step_search:
  source_endpoint: 60
  outcome_endpoint: 61
  exact_state_feasible_support_only: true
  normalized_action_dimensions: 36
  exact_feasibility: score_less_than_or_equal_to_1_and_not_terminated
  baseline_candidates:
    - zero_residual
    - teacher_or_current_continuation_deterministic_action_if_available
    - historical_best_A_action
    - historical_best_B_action
  sobol:
    seed: 600061
    actions: 4096
    distribution: uniform_exact_state_support
  CEM:
    seed: 610060
    generations: 6
    population: 512
    total_actions: 3072
    elite_fraction: 0.10
    elite_count: 52
    initial_center: best_baseline_or_Sobol_action
    initial_std_fraction_of_support_width: 0.25
    project_to_exact_support: true
  maximum_new_control_intervals_per_boundary: 7168
  save_top_actions: 32
  exact_feasible_replay_must_be_bitwise_equal: true
  hyperparameter_sweep_allowed: false

prefrozen_classification:
  C1:
    condition: continuous_previous_policy_endpoint41_80_is_40_of_40
    classification: POLICY_CARRYOVER_SOLVES_NEXT_WINDOW
    action: stop_and_write_separate_promotion_request
  C3:
    condition: A_and_B_not_feasible_and_P_feasible
    classification: ARRIVAL_STATE_VIABILITY_BOTTLENECK
    action: stop_previous_solver_warm_start_or_carryover_becomes_next_candidate
  C2:
    condition: A_or_B_feasible_regardless_of_P
    classification: ONE_STEP_VIABLE_ACTION_EXISTS
    action: stop_no_automatic_LR_or_curriculum_change
  C4:
    condition: no_feasible_action_found_on_A_B_or_P
    classification: NO_ONE_STEP_FEASIBLE_ACTION_FOUND_ON_KNOWN_ENDPOINT60_STATES
    interpretation: finite_negative_evidence_not_mathematical_infeasibility
    action: stop_close_tail_reset_LR_sigma_and_more_source60_exploration

