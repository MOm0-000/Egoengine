schema: calibration_known_answer_blindtest_v1
status: PUBLIC_DEVELOPMENT_ONLY
baseline_commit: 44c1054aee0227488b378f4a1f58810cab2c2f18
formal_exam_executed: false

authorization:
  synthetic_static_rendering: true
  public_known_answer_practice: true
  occlusion_selection_bugfix: true
  formal_secret_generation_by_codex: false
  real_taco_refit: false
  real_taco_source_mutation: false
  mink: false
  physics: false
  replay: false
  mpc: false
  reinforcement_learning: false
  promotion: false
  chunk_commit: false

public_development:
  seed: 20261007
  camera_views: 5
  points_per_face: 3
  fit_models: [WORLD_FIXED, CAMERA_LOCAL]
  correction_cases:
    - {name: identity, translation_m: [0.0, 0.0, 0.0], rotvec_rad: [0.0, 0.0, 0.0]}
    - {name: translation, translation_m: [0.009, -0.006, 0.013], rotvec_rad: [0.0, 0.0, 0.0]}
    - {name: rotation, translation_m: [0.0, 0.0, 0.0], rotvec_rad: [0.021, -0.034, 0.017]}
    - {name: combined, translation_m: [-0.014, 0.008, 0.019], rotvec_rad: [-0.026, 0.019, 0.031]}
  quality_cases:
    - {name: clean, noise_std_m: 0.0, missing_fraction: 0.0, outlier_fraction: 0.0}
    - {name: noisy, noise_std_m: 0.0005, missing_fraction: 0.0, outlier_fraction: 0.0}
    - {name: missing, noise_std_m: 0.0, missing_fraction: 0.25, outlier_fraction: 0.0}
    - {name: outliers, noise_std_m: 0.0, missing_fraction: 0.0, outlier_fraction: 0.05}
    - {name: combined_degradation, noise_std_m: 0.0005, missing_fraction: 0.25, outlier_fraction: 0.05}

shapes:
  artificial:
    kind: asymmetric_convex_hull
  taco:
    kind: existing_mesh_shape_only
    path: /data_all/zzx/3.2RL/data/taco_v1/dev4/object_models/object_models_released/071_cm.obj
    scale: 0.01

image_cases:
  width: 96
  height: 72
  fx: 105.0
  fy: 105.0
  depth_scale: 4000.0
  erosion_px: 1
  spatial_stride_px: 2
  visibility_uncertainty_margin_m: 0.002
  cases:
    - {name: no_occlusion_float, occluder: none, encoding: float32, pose_error_m: 0.0}
    - {name: hand_partial_float, occluder: hand_partial, encoding: float32, pose_error_m: 0.0}
    - {name: hand_large_uint16, occluder: hand_large, encoding: uint16, pose_error_m: 0.0}
    - {name: hand_complete_float, occluder: hand_complete, encoding: float32, pose_error_m: 0.0}
    - {name: other_object_front, occluder: other_front, encoding: float32, pose_error_m: 0.0}
    - {name: target_front, occluder: other_behind, encoding: float32, pose_error_m: 0.0}
    - {name: nominal_pose_error, occluder: hand_partial, encoding: float32, pose_error_m: 0.015}

fit:
  robust_loss: soft_l1
  robust_scale_m: 0.01
  maximum_translation_m: 0.10
  maximum_rotation_deg: 10.0
  maximum_function_evaluations: 120
  minimum_points: 24
  baseline_finite_difference_relative_step: null
  fixed_finite_difference_relative_step: 0.001

formal_exam:
  secret_seed_must_be_external: true
  case_count_multiplier: 1
  solver_network: disabled
  answer_mount_in_solver: forbidden
  input_field_whitelist:
    - case_kind
    - vertices
    - faces
    - points_camera
    - observation_offsets
    - world_to_camera
    - object_to_world
    - measured_depth_m
    - target_nominal_depth_m
    - occluder_nominal_depths_m
    - intrinsic
    - erosion_px
    - spatial_stride_px
    - visibility_uncertainty_margin_m

output: /data_all/zzx/Egoengine_upload_3_2/rl/runs/calibration_known_answer_blindtest_v1/development
