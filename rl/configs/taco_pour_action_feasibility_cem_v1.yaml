schema: taco_pour_action_feasibility_cem_v1
status: authorized_read_only_gate
paper_faithful: false
classification: local_engineering_action_space_feasibility_not_EgoEngine_RL
purpose: >-
  Freeze the previous per-source counterfactual chain and test whether the
  current world-frame 36-D residual representation and its current support can
  produce a three-control-interval feasible sequence from three exact states.

runtime:
  backend: CPU_MuJoCo_Warp
  training_allowed: false
  optimizer_updates_policy: false
  actor_frozen: true
  critic_frozen: true
  observation_normalization_frozen: true
  reward_changed: false
  objective_changed: false
  reference_timing_changed: false
  action_frame_changed: false
  action_scale_changed: false
  action_support_changed: false
  PPO_hyperparameters_changed: false
  chunk_acceptance_allowed: false
  chunk_commit_allowed: false

fixed_diagnostic_states:
  - name: formal_source45
    source_endpoint: 45
    provenance: formal_single_pass_deterministic_PPO_path
  - name: prefix_source50
    source_endpoint: 50
    provenance: source45_zero_right_wrist_translation_then_frozen_PPO
  - name: tail_source57
    source_endpoint: 57
    provenance: selected_tail_semantic_oracle_path_through_source56

action_contract:
  action_dimensions: 36
  representation: world_frame_additive_residual
  residual_scale: 0.05
  current_state_feasible_support_only: true
  per_transition_bounds_recomputed_from_frozen_reference_and_ctrlrange: true
  relaxed_support_allowed: false
  object_frame_comparison_allowed: false
  axis_or_scale_sweep_allowed: false

optimizer:
  algorithm: deterministic_CEM
  horizon_control_intervals: 3
  population: 24
  elites: 6
  iterations: 5
  restarts:
    - name: frozen_actor_centered
      seed_offset: 0
    - name: zero_residual_centered
      seed_offset: 1000
  benchmark_base_seeds:
    formal_source45: 45000
    prefix_source50: 50000
    tail_source57: 57000
  normalized_latent_interval: [-1.0, 1.0]
  initial_standard_deviation: 0.6
  elite_update_new_weight: 0.75
  minimum_standard_deviation: 0.05
  injected_candidates_each_iteration:
    - current_CEM_mean
    - frozen_actor_open_loop_sequence
    - zero_residual_sequence
  stop_on_first_feasible: false
  candidate_sequence_count_per_state: 240
  ranking_lexicographic:
    - nonfinite_endpoint_count
    - tracking_boundary_violation_count
    - maximum_objective_score
    - sum_objective_score
    - squared_normalized_action_norm_tie_break_only

primary_gate:
  local_sequence_feasible_if:
    - all_three_endpoint_states_finite
    - all_three_objective_scores_strictly_below_1
  source57_is_decisive_for_current_second_window: true
  optimizer_failure_is_mathematical_infeasibility_proof: false
  if_source57_feasible: current_action_representation_and_support_sufficient_for_this_local_window
  if_source57_not_feasible: >-
    current_support_feasibility_not_demonstrated; a separately frozen minimum-rho
    or coordinate-frame gate is required before changing the action interface

stopping_rule:
  new_per_source_suppression_hold_or_manual_counterfactuals_allowed: false
  automatic_translation_support_search_allowed: false
  automatic_coordinate_frame_search_allowed: false
  gate_B_observation_sufficiency_allowed_before_gate_A_classification: false
  gate_C_policy_representability_allowed_before_gate_B: false
  gate_D_fresh_PPO_allowed_before_gates_A_B_C: false

