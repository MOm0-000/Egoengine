schema: taco_pour_candidate_F_two_chunk_curriculum_v1
status: authorized_fixed_two_chunk_curriculum_200k
paper_faithful: false
classification: local_balanced_two_chunk_lookahead_curriculum
base_git_commit: aa11d0d5aa858530adbb1e3657a18c679c601c28
purpose: >-
  Repair the measured endpoint40 next-chunk visitation starvation while
  preserving Candidate D's policy, optimizer, reward, observation, action and
  physics contracts. The 2+2 reset distribution is local engineering, not a
  recovered EgoEngine author implementation.

candidate_F:
  fresh_seeds: [0, 1, 2]
  warm_start_allowed: false
  initialization: replay_preserving
  location_parameterization: support_anchored_piecewise_tanh
  initial_sigma_multiplier: 0.25
  actor_learning_rate: 0.0001
  actor_mini_epochs: 1
  critic_mini_epochs: 4
  worlds: 4
  horizon_control_intervals_per_world: 40
  physics_steps_per_epoch: 1600
  maximum_epoch: 125
  maximum_physics_steps_per_seed: 200000
  fixed_milestone_epochs: [62, 125]
  strict_success: 40_of_40
  first_strict_success_action: stop_all_restarts_request_separate_promotion
  non_strict_checkpoint_selection_allowed: false
  chunk_commit_allowed: false

curriculum:
  activation_epoch: 63
  epochs_1_through_62_world_starts: [40, 40, 40, 40]
  epochs_63_through_125_world_starts: [40, 40, 60, 60]
  fixed_assignment: true
  random_tail_selection: false
  ratio_sweep_allowed: false
  tail_A: {teacher_seed: 0, teacher_epoch: 125, reference_endpoint: 60}
  tail_B: {teacher_seed: 1, teacher_epoch: 125, reference_endpoint: 60}
  tail_rnn_refresh_every_epoch: true
  tail_physics_off_policy: true
  tail_direct_chunk_commit_allowed: false

validation:
  source_endpoint: 40
  lookahead_endpoint: 80
  intervals: 40
  recurrent_state: zero
  deterministic_action: bounded_distribution_mean
  milestones: [0, 62, 125]
  acceptance: strict_40_of_40

coverage_audit:
  relative_source_offset: k_equals_source_endpoint_minus_40
  segments: {pre_curriculum: [1, 62], curriculum: [63, 125]}
  cohorts:
    all_worlds: [0, 1, 2, 3]
    anchor_worlds: [0, 1]
    tail_worlds: [2, 3]
  fractions: [k_ge_21, k_ge_25, k_ge_30, k_ge_35]
  counts:
    - source60_action
    - endpoint61_tracking_termination
  histograms:
    - maximum_reached_k_by_epoch_world
    - tracking_termination_endpoint

prefrozen_classification:
  F1:
    condition: any_fixed_milestone_40_of_40
    classification: LOOKAHEAD_CURRICULUM_STRICT_SUCCESS
    action: stop_all_seeds_request_separate_promotion
  F2:
    condition: no_strict_success_and_median_epochs63_125_deep_fraction_at_least_0p20
    classification: LOOKAHEAD_COVERAGE_RESTORED_NO_STRICT_SUCCESS
    action: authorize_future_optimizer_review_with_curriculum_preserved
  F3:
    condition: no_strict_success_and_median_epochs63_125_deep_fraction_below_0p05
    classification: TAIL_TRANSITION_REMAINS_BOTTLENECK
    action: stop_optimizer_LR_remains_blocked
  F4:
    condition: otherwise
    classification: MIXED_CURRICULUM_RESULT
    action: stop_no_ratio_or_LR_sweep

