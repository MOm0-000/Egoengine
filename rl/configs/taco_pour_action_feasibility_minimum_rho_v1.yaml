schema: taco_pour_action_feasibility_minimum_rho_v1
status: authorized_read_only_gate
paper_faithful: false
classification: local_engineering_minimum_translation_support_diagnostic_not_EgoEngine_RL
purpose: >-
  Continue Gate A after finite CEM found no current-support source57 solution.
  Jointly optimize a three-step residual sequence and one constant right-wrist
  translation support multiplier rho, without manually sweeping scale values.

runtime:
  backend: CPU_MuJoCo_Warp
  training_allowed: false
  optimizer_updates_policy: false
  actor_frozen: true
  critic_frozen: true
  observation_normalization_frozen: true
  reward_changed: false
  objective_changed: false
  reference_timing_changed: false
  action_frame_changed: false
  nontranslation_action_support_changed: false
  chunk_acceptance_allowed: false
  chunk_commit_allowed: false

source_state:
  name: tail_source57
  source_endpoint: 57
  provenance: selected_tail_semantic_oracle_path_through_source56
  exact_gate_A0_state_reproduction_required: true

support_parameter:
  symbol: rho
  applies_only_to_normalized_action_indices: [0, 1, 2]
  semantic_group: right_wrist_world_translation
  physical_bound_equation: abs_delta_p_m_le_rho_times_0.05
  lower: 1.0
  upper: 3.0
  upper_bound_provenance: >-
    covers the previously measured source57 pre-projection z request 2.598893
    without introducing a manual list of candidate scales
  constant_across_three_step_sequence: true
  actuator_ctrlrange_remains_hard_constraint: true
  all_other_33_dimensions_remain_in_current_state_feasible_support: true

optimizer:
  algorithm: constrained_deterministic_CEM
  horizon_control_intervals: 3
  population: 32
  elites: 8
  iterations: 8
  restarts:
    - {name: current_support_centered, seed: 57101, initial_rho: 1.0}
    - {name: evidence_upper_region_centered, seed: 57102, initial_rho: 2.6}
  initial_action_latent_standard_deviation: 0.5
  initial_rho_latent_standard_deviation: 0.5
  elite_update_new_weight: 0.75
  minimum_standard_deviation: 0.04
  injected_candidates_each_iteration:
    - current_CEM_mean
    - gate_A0_best_sequence_at_rho_1
    - zero_residual_sequence_at_rho_1
  stop_on_first_feasible: false
  candidate_sequence_count: 512
  ranking_lexicographic:
    infeasible:
      - nonfinite_endpoint_count
      - tracking_boundary_violation_count
      - maximum_objective_score
      - sum_objective_score
    feasible:
      - rho
      - maximum_objective_score
      - sum_objective_score

primary_gate:
  feasible_if:
    - all_three_endpoint_states_finite
    - all_three_objective_scores_strictly_below_1
  reported_minimum_rho_is_best_observed_not_mathematical_proof: true
  if_feasible: >-
    report the smallest observed rho and keep any action-interface change blocked
    until an independent exact replay and a separately authorized architecture candidate
  if_not_feasible: >-
    support expansion through rho=3 did not demonstrate feasibility; proceed only
    to a separately frozen coordinate-frame comparison within Gate A

stopping_rule:
  manual_rho_sweep_allowed: false
  automatic_upper_bound_expansion_allowed: false
  per_axis_bound_search_allowed: false
  object_frame_search_in_this_gate_allowed: false
  gate_B_before_gate_A_classification_allowed: false
  policy_training_allowed: false

