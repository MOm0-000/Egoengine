schema: taco_pour_tail_curriculum_reset_v1
status: engineering_gate_only_training_forbidden
paper_faithful: false
purpose: >-
  Test whether naturally reached tail physics states and the recurrent actor
  memory that belongs to them can be saved and restored without changing
  policy semantics. This file does not authorize PPO training.

fixed_experiment_if_later_authorized:
  training_worlds: 4
  epochs: 8
  total_training_samples: 1280
  horizon_samples_per_epoch: 160
  CPU_acceptance_start_endpoint: 20
  CPU_acceptance_required_steps: 40
  objective_reward_observation_action_unchanged: true
  seed_sweep_allowed: false
  epoch_sweep_allowed: false
  world_count_sweep_allowed: false

boundary_source_contract:
  gt_state_injection_allowed: false
  natural_simulator_rollout_required: true
  complete_342_field_physics_state_required: true
  corresponding_actor_rnn_state_required: true
  complete_natural_observation_prefix_required: true
  actor_and_input_normalization_hash_required: true
  actor_hash_mismatch_must_fail_closed: true
  terminated_states_allowed: false
  exploration_rng_replayed: false
  independent_stochastic_branches_required: true

engineering_gate:
  training_executed: false
  save_and_restore_pair_bitwise: required
  rebuilt_observation_bitwise_equal: required
  deterministic_action_after_restore_bitwise_equal: required
  next_rnn_state_after_restore_bitwise_equal: required
  deterministic_CPU_next_physics_state_bitwise_equal: required
  four_world_mixed_tail_restore: required
  stale_actor_memory_rejection: required
  same_actor_prefix_replay_must_reproduce_saved_memory: required
  changed_actor_prefix_replay_must_produce_accepted_refreshed_memory: required

actor_update_refresh_contract: >-
  A recurrent state is valid only for the actor and input-normalization state
  that generated it. After an actor update, the old hidden state is rejected.
  The accepted local refresh candidate replays the saved natural observation
  prefix through the current actor and binds the recomputed hidden state to the
  new actor hash without modifying the saved physical state.

remaining_limit: >-
  Observation-prefix replay makes recurrent memory consistent with the current
  actor and the recorded physical history, but the saved tail physical state
  was generated by the earlier behavior policy. This is an explicit off-policy
  curriculum start distribution, not a claim that the updated actor naturally
  generated that state. Formal sampler integration remains a separate gate.
