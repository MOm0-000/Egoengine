schema: taco_pour_algorithmic_reproduction_training_benchmark_v5
status: authorized_candidate_C_fresh_400k
paper_faithful: false
classification: local_algorithmic_reproduction_H2S2R_LSTM_mean_regularization_ablation
purpose: >-
  Test whether the H2S2R public LSTM PPO actor-mean regularization prevents
  Candidate B's long-budget raw-mean drift outside the state-feasible
  truncated-Gaussian support. This is a local reproduction ablation, not a
  recovered EgoEngine author parameter.

v4_evidence_immutable: true
v4_checkpoint_resume_allowed: false
v4_threshold_or_history_rewrite_allowed: false

candidate_C:
  seeds: [0, 1, 2]
  initialization: replay_preserving
  mean_head_weight: 0.0
  mean_head_bias: 0.0
  initial_sigma_multiplier: 0.25
  bounds_loss_coef: 0.005
  bound_loss_type: regularisation
  actor_bound_loss: '0.005 * mean(sum(mu^2, dim=action))'
  provenance: upstream_public_H2S2R_CrossEmbodimentPPOLSTM_config
  actor_mini_epochs: 1
  critic_mini_epochs: 4
  actor_learning_rate: 0.0001
  critic_learning_rate: unchanged
  linear_LR_allowed: false
  adaptive_LR_allowed: false
  half_LR_allowed: false
  KL_penalty_allowed: false
  target_KL_allowed: false
  warm_start_allowed: false
  seed_specific_settings_allowed: false
  intermediate_checkpoint_selection_allowed: false
  automatic_1m_allowed: false
  chunk_commit_allowed: false

frozen_task:
  episode: '20230927_017'
  boundary_endpoint: 20
  validation_sources: [20, 59]
  validation_endpoints: [21, 60]
  validation_intervals: 40
  timing:
    action_at_source_t_uses_reference: t_plus_1
    reward_for_state_t_plus_1_uses_reference: t_plus_1
  collision_scene: current_mixed_formal_scene
  actuator: current_unlimited_affine_position_actuator
  objective: taco_pour_local_normalized_ellipse_v1
  residual_scale: 0.05
  action_frame: world_or_base
  action_distribution: taco_pour_baseline_preserving_truncated_gaussian_v2
  residual_execution_identity: original_formal_reference_plus_residual
  action_bound_contract: baseline_preserving_nonworsening_ctrlrange_violation
  observation: taco_pour_transition_aligned_236d_v1
  observation_dimension: 236
  observation_RMS: frozen_across_rollout_and_optimizer_then_committed_once
  worlds: 4
  horizon_control_intervals_per_world: 40
  physics_steps_per_control_interval: 10
  physics_steps_per_epoch: 1600
  control_intervals_per_epoch: 160
  seed: per_run_0_1_2

step0_gate:
  required_for_every_seed: true
  before_optimizer_updates: true
  actor_mean_max_abs_tolerance: 1.0e-7
  deterministic_action_max_abs_tolerance: 1.0e-7
  command_bitwise_equal_Replay: true
  qpos_bitwise_equal_Replay: true
  qvel_bitwise_equal_Replay: true
  score_bitwise_equal_Replay: true
  termination_bitwise_equal_Replay: true
  contact_flags_bitwise_equal_Replay: true
  successful_intervals: 30
  first_failure_endpoint: 51
  failure_action: stop_whole_candidate_before_training

likelihood_gate:
  semantic_fields_exact:
    - actor_parameters
    - actor_RMS
    - normalization_version
    - observations
    - dones
    - actions
    - action_bounds
    - RNN_start_states
  canonical_optimizer_ratio_bitwise_one: true
  canonical_optimizer_ratio_max_error: 0.0
  rollout_to_canonical_role: numerical_diagnostic_only_below_semantic_hard_fail
  retired_v4_numerical_blocker: 1.52587890625e-5
  semantic_hard_fail: 1.0e-4
  v4_history_rewrite_allowed: false

fixed_milestones:
  - {name: '0', epoch: 0, physics_steps: 0, control_intervals: 0}
  - {name: 100k, epoch: 62, physics_steps: 99200, control_intervals: 9920}
  - {name: 200k, epoch: 125, physics_steps: 200000, control_intervals: 20000}
  - {name: 300k, epoch: 188, physics_steps: 300800, control_intervals: 30080}
  - {name: 400k, epoch: 250, physics_steps: 400000, control_intervals: 40000}

passive_support_metrics:
  - minimum_truncated_normalization_mass
  - p01_truncated_normalization_mass
  - median_truncated_normalization_mass
  - raw_mu_outside_support_fraction
  - maximum_support_violation_in_sigma
  - p95_support_violation_in_sigma
  - deterministic_action_bound_fraction
  - deterministic_effective_residual_RMS
  - exact_post_update_KL
  - ratio_outside_0p8_1p2
  - sigma
  - training_reward
  - actor_mean_regularization

validation:
  deterministic_truncated_mode: true
  frozen_RMS: true
  fixed_milestone_checkpoint_roundtrip_required: true
  deterministic_endpoint20_to60_validation_required: true
  formal_success_requires: 40_of_40
  Replay_successful_intervals: 30
  intermediate_checkpoint_selection_allowed: false
  seed_robust_strict_success_requires: at_least_2_of_3_seeds_40_of_40
  chunk_commit_requires_separate_authorization: true

prefrozen_classification:
  C1:
    condition: >-
      all three seeds reach 400k, no mass-floor failure, minimum mass remains
      at least 1e-12, support drift is materially lower than Candidate B, and
      deterministic bound occupancy does not monotonically explode
    interpretation: H2S2R_mean_regularization_fixes_structural_instability
    active_baseline_requires_median_validated_intervals_gt: 30
  C2:
    condition: all three seeds reach 400k but median validation is at most 30 or declines after 100k
    interpretation: numerical_stability_fixed_but_policy_performance_drifts
    next_candidate_only_after_review: H2S2R_LSTM_linear_LR_schedule
  C3:
    condition: any seed reaches normalization mass below 1e-12 before 400k
    interpretation: unconstrained_raw_mu_state_truncated_Normal_unsuitable_for_long_training
    regularization_coefficient_sweep_allowed: false
  C4:
    condition: any fixed milestone is 40_of_40
    interpretation: strict_success_exists_no_automatic_chunk_commit

forbidden:
  - Candidate_A
  - Candidate_B_resume
  - linear_LR
  - half_LR
  - adaptive_LR
  - KL_penalty_or_target_KL
  - normalization_mass_floor_change
  - sigma_change
  - residual_scale_change
  - network_change
  - reward_or_objective_change
  - observation_change
  - intermediate_best_checkpoint_selection
  - automatic_1m
  - chunk_commit

historical_v4_interpretation: >-
  Candidate B can learn useful refinement at 100k, but the current fixed-LR,
  unregularized truncated-Gaussian PPO exhibits sustained action-support drift
  at longer budgets; two seeds enter extremely low-probability truncated
  regions and all three stop before the authorized 500k endpoint.

