schema: taco_pour_candidate_G_value_loss_isolation_v1
status: authorized_bounded_value_loss_isolation
base_branch: 3.2RL
base_git_commit: 5f036bc8c2225b55ca14fd60d2a1a10158f24edf
paper_faithful: false
execution_authorized_now: true
purpose: >-
  Isolate the internal value-loss contribution at the three Candidate-G first
  updates using fixed historical batches, exact loss-wise gradients, paired
  single shadow Adam steps, and bounded CPU closed-loop probes.

scope:
  candidate_G_classification_changed: false
  new_long_training_authorized: false
  chunk_commit_authorized: false
  this_is_not_read_only_computation: true
  historical_artifacts_immutable: true
  automatic_followon_training: false
  prospective_fallback_on_reconstruction_failure: false

analysis_points:
  training_seeds: [0, 1, 2]
  source_checkpoint_epoch: 0
  target_update_epoch: 1
  same_donor: {candidate: D, seed: 2, epoch: 125, source_endpoint: 20}
  checkpoint_selection: predeclared_first_update_only

frozen_task:
  source_endpoint: 40
  end_endpoint: 80
  world_starts: [40, 40, 40, 40]
  rollout_horizon_per_world: 40
  worlds: 4
  physics_steps_per_control: 10
  backend: CPU_MuJoCo_Warp
  tracking_variant: tool_only
  reward_action_observation_physics_reference_changed: false

reconstruction:
  prefer_checkpoint: G_own_epoch0000_not_donor_training_resume
  one_collection_batch_per_seed: true
  restore_rng_after_object_construction: true
  rebuild_original_epoch_bound_context: true
  prepare_dataset_calls_per_seed: 1
  external_critic_update_before_actor: original_4_mini_epochs_once_per_seed
  retain_original_value_normalization_order: true
  explicit_value_normalizer_alias_audit: true
  save_complete_new_reconstruction_batch: true
  require_recorded_epoch1_batch_and_full_update_regression: true
  no_extra_batches_to_force_match: true

branches:
  BASE: {actor_loss: none, actor_optimizer_steps: 0}
  FULL:
    actor_loss: L_policy + 2.0 * L_internal_value
    actor_optimizer_steps: 1
    historical_regression_required: true
  POLICY_ONLY:
    actor_loss: L_policy
    actor_optimizer_steps: 1
    remove_only_actor_internal_value_term: true
  VALUE_ONLY:
    actor_loss: 2.0 * L_internal_value
    actor_optimizer_steps: 1
    mechanism_probe_not_solver: true

paired_invariants:
  same_batch_advantages_returns_and_old_values: true
  same_preupdate_actor_and_optimizer_state: true
  same_parameter_groups: true
  actor_learning_rate: 0.0001
  adam_eps: 1.0e-08
  adam_other_hyperparameters: restore_original_G_values
  gradient_norm: 1.0
  mixed_precision: false
  clipped_policy_loss_unchanged: true
  clipped_internal_value_loss_unchanged: true
  canonical_denominator_detached_not_ratio_constant: true
  external_critic_and_GAE_not_recomputed_per_branch: true
  no_network_architecture_change: true

gradient_decomposition:
  losses: [L_policy, 2.0 * L_internal_value, L_policy + 2.0 * L_internal_value]
  groups:
    - all_parameters
    - shared_MLP_LSTM_layer_norm
    - policy_mean_head
    - log_sigma
    - internal_value_head
  weighted_norms_and_cosines: true
  none_gradients_recorded_separately: true
  linearity_relative_L2_tolerance: 1.0e-05
  zero_denominator_floor: 1.0e-12
  gradient_norm_is_not_optimizer_contribution_fraction: true

post_update_regression_tolerances:
  existing_v6_identity_gate_unchanged: true
  mu_sigma_absolute_tolerance: 9.5367431640625e-07
  joint_logprob_ratio_absolute_tolerance: 0.0001
  scalar_metric_rtol: 1.0e-05
  scalar_metric_atol: 1.0e-07
  widening_allowed: false

closed_loop_probe:
  branches: [BASE, FULL, POLICY_ONLY, VALUE_ONLY]
  rollouts_per_seed: 4
  control_intervals_per_rollout: 40
  physics_start: immutable_committed_endpoint40_full_snapshot
  actor_observation_RMS: original_rollout_RMS_before_post_epoch_commit_same_for_all_branches
  RNN: reencode_sources20_39_under_branch_actor_and_common_RMS
  action: deterministic_bounded_mu
  auto_reset: false
  count_only_pre_first_failure_valid_prefix: true
  BASE_expected_valid_steps: 20
  BASE_expected_first_failure_endpoint: 61
  accidental_40_of_40: record_diagnostic_event_no_promotion_or_extra_replay

budget:
  maximum_collection_batches: 3
  maximum_collection_control_intervals: 480
  maximum_closed_loop_rollouts: 12
  maximum_closed_loop_control_intervals: 480
  maximum_total_control_intervals: 960
  maximum_total_physics_steps: 9600
  maximum_shadow_actor_optimizer_steps: 9
  maximum_external_critic_optimizer_steps: 12
  maximum_all_optimizer_steps: 21
  record_network_forward_and_backward_calls: true
  automatic_extension: false
  new_long_training_epochs: 0

decision:
  validity_states:
    - INCOMPLETE_INPUT_OR_RECONSTRUCTION
    - DIAGNOSTIC_CONTRACT_FAILURE
    - COMPLETED_BOUNDED_VALUE_LOSS_ISOLATION
  per_seed_review_trigger:
    VALUE_ONLY_bounded_mu_change_exceeds_float32_8eps: true
    KL_FULL_greater_than: 1.0e-08
    KL_POLICY_ONLY_at_most_fraction_of_FULL: 0.5
    POLICY_ONLY_valid_prefix_at_least: 20
    POLICY_ONLY_valid_prefix_at_least_FULL: true
  review_trigger: at_least_2_of_3_meet_all_per_seed_conditions_and_no_seed_POLICY_ONLY_worse_than_FULL
  positive_recommendation: REVIEW_ACTOR_INTERNAL_VALUE_DECOUPLING_ABLATION
  coupling_without_benefit: VALUE_POLICY_COUPLING_PRESENT_BUT_BENEFIT_UNRESOLVED
  no_resolved_effect: NO_RESOLVED_POLICY_EFFECT_AT_TESTED_FIRST_UPDATES
  negative_evidence_flag: ISOLATION_NOT_FAVORED_AT_TESTED_UPDATES_if_POLICY_ONLY_worse_in_at_least_2_seeds
  thresholds_are_local_reporting_only: true
  authorizes_long_training: false

