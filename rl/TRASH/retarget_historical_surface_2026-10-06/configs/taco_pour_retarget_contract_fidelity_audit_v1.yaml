  numerical_tolerance_m: 2.0e-7
  native_material_reporting_threshold_m: 5.0e-5
  separate_scene_monitor_from_left_candidate_gate: true

visual_review:
  blinded_before_metric_reveal: true
  views: [top, oblique]
  labels: [PREFERRED_OVER_OLD, WORSE_THAN_OLD, AMBIGUOUS, GEOMETRICALLY_INVALID]
  aspects:
    - wrist_palm_height_phase
    - ring_shape
    - pinky_shape
    - tray_rim_spatial_relation
    - collateral_thumb_index_middle

final_classifications:
  - OBJECTIVE_AND_GEOMETRY_CONTRACT_CERTIFIED
  - SEMANTIC_LANDMARK_BLOCKER
  - OBJECTIVE_FIDELITY_BLOCKER
  - COLLISION_PROXY_SEMANTICS_BLOCKER
