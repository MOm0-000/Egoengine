interpretation: >-
  The failure-focused probes move toward their final saturated directions
  during optimizer updates, while RMS commits have negative net movement.
  Later passes over the same rollout exhibit broad likelihood drift. Reducing
  actor mini-epochs from four to one is the smallest threshold-free test of
  the multi-pass hypothesis. It does not assert that one pass will succeed.

