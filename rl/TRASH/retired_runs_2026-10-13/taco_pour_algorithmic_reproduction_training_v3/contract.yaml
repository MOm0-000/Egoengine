schema: taco_pour_algorithmic_reproduction_training_benchmark_v3
status: authorized_fresh_B0_roundtrip_then_A_B_training
paper_faithful: false
classification: local_algorithmic_reproduction_after_replay_identity_and_numeric_likelihood_gate_fix
purpose: >-
  Preserve the benchmark-v2 residual-identity repair and all declared learning
  settings while replacing its over-strict fixed likelihood gate with one
  predeclared float32 ULP-aware numerical-equivalence gate. Then run fresh A/B
  learning curves from zero without reusing the three invalidated v2 updates.

v1_failure_cause: state_feasible_reference_snap_broke_zero_residual_identity
v1_evidence_immutable: true
v2_evidence_immutable: true
v2_status: halted_fail_closed_pre_optimizer_likelihood_identity_epoch4
v2_checkpoint_resume_allowed: false
v2_epoch4_reclassification: numerical_C_D_pass_under_v3_tolerances_only

runtime:
  order: [v2_numeric_reclassification, candidate_B_step0_gate, checkpoint_roundtrip_gate, candidate_A_seed0, candidate_B_seed0, conditional_multiseed]
  CPU_MuJoCo_Warp_is_only_training_backend: true
  CPU_MuJoCo_Warp_is_only_validation_backend: true
  native_MuJoCo_acceptance_allowed: false
  physics_contact_backend_or_source_audit_allowed: false
  chunk_commit_allowed: false
  old_checkpoint_warm_start_allowed: false
  automatic_candidate_C_allowed: false
  seed0_scheduling: full_A_then_full_B_due_resume_complexity
  milestone_interleaving_preferred_but_not_required: true
  stop_at_100k_without_quality_failure_allowed: false

frozen_task:
  episode: '20230927_017'
  boundary_endpoint: 20
  validation_sources: [20, 59]
  validation_endpoints: [21, 60]
  validation_intervals: 40
  timing:
    action_at_source_t_uses_reference: t_plus_1
    reward_for_state_t_plus_1_uses_reference: t_plus_1
  collision_scene: current_mixed_formal_scene
  actuator: current_unlimited_affine_position_actuator
  objective: taco_pour_local_normalized_ellipse_v1
  residual_scale: 0.05
  action_frame: world_or_base
  action_distribution: taco_pour_baseline_preserving_truncated_gaussian_v2
  residual_execution_identity: original_formal_reference_plus_residual
  action_bound_contract: baseline_preserving_nonworsening_ctrlrange_violation
  observation: taco_pour_transition_aligned_236d_v1
  observation_dimension: 236
  observation_RMS: frozen_across_rollout_and_optimizer_then_committed_once
  actor_mini_epochs: 1
  critic_mini_epochs: 4
  actor_learning_rate: 0.0001
  actor_learning_rate_5e_minus_5_allowed: false

candidates:
  A:
    name: current_single_pass_PPO_baseline
    fresh_actor_critic_optimizers: true
    seed0_only_initially: true
    initialization: current_formal_random_initialization
  B:
    name: replay_preserving_residual_PPO
    fresh_actor_critic_optimizers: true
    seed0_only_initially: true
    mean_head_weight: 0.0
    mean_head_bias: 0.0
    initial_sigma_multiplier_vs_current: 0.25
    all_non_mean_network_parameters_use_current_initialization: true
    sigma_remains_learnable: true
    step0_gate:
      mean_max_abs_tolerance: 1.0e-7
      deterministic_action_max_abs_tolerance: 1.0e-7
      deterministic_command_must_equal_formal_Replay: true
      successful_intervals: 30
      first_failure_endpoint: 51
      failure_action: stop_without_training_A_or_B

training_budget:
  worlds: 4
  horizon_control_intervals_per_world: 40
  physics_steps_per_control_interval: 10
  physics_steps_per_epoch: 1600
  control_intervals_per_epoch: 160
  seed0_milestones:
    ckpt_100k:
      target_physics_steps: 100000
      declared_nearest_epoch: 62
      actual_physics_steps: 99200
      actual_control_intervals: 9920
    ckpt_500k:
      target_physics_steps: 500000
      declared_nearest_epoch: 313
      actual_physics_steps: 500800
      actual_control_intervals: 50080
    ckpt_1m:
      target_physics_steps: 1000000
      declared_nearest_epoch: 625
      actual_physics_steps: 1000000
      actual_control_intervals: 100000
  checkpoint_payload_required:
    - actor
    - critic
    - actor_optimizer
    - critic_optimizer
    - observation_RMS
    - normalization_version
    - simulation_physics_steps
    - simulation_control_intervals
    - Python_NumPy_Torch_RNG_states
    - frozen_config_hashes
  checkpoint_roundtrip_required_at_every_milestone: true
  deterministic_validation_required_at_every_milestone: true
  conditional_multiseed:
    trigger: candidate_seed0_ckpt_1m_validated_intervals_gt_30
    additional_seeds: [1, 2]
    budget_each_physics_steps: 1000000

validation:
  deterministic_truncated_mode: true
  frozen_RMS: true
  stop_count_at_first_violation: true
  diagnostic_full_trajectory_copy_allowed: true
  formal_success_requires: 40_of_40
  benchmark_refinement_requires_intervals_gt: 30
  meaningful_refinement_requires_intervals_at_least: 35
  checkpoint_validation_does_not_change_training_configuration: true
  baselines:
    Replay: {successful_intervals: 30, first_failure_endpoint: 51}
    historical_single_pass_diagnostic: {successful_intervals: 28, first_failure_endpoint: 49}

quality_gates:
  pre_optimizer_likelihood_identity:
    profile: float32_ulp_aware_v1
    dtype: float32
    epsilon: 1.1920928955078125e-7
    mu_tolerance_ulps: 8
    sigma_tolerance_ulps: 8
    ratio_tolerance_ulps: 128
    mu_atol: 9.5367431640625e-7
    sigma_atol: 9.5367431640625e-7
    ratio_atol: 1.52587890625e-5
    semantic_identity_hard_fail: 1.0e-4
    actor_parameter_hash_exact_equal_required: true
    actor_RMS_hash_exact_equal_required: true
    normalization_version_exact_equal_required: true
    pass_requires_all_A_B_C_D: true
    semantic_identity_hard_fail_is_classification_not_pass_threshold: true
  critic_recompute_tolerance: 2.0e-5
  observation_RMS_mutation_during_optimizer_forbidden: true
  nonfinite_update_forbidden: true
  checkpoint_roundtrip_validation_must_reproduce: true
  record_each_actor_update:
    - exact_old_to_new_truncated_policy_KL
    - clip_fraction
    - ratio_min_max
    - ratio_outside_0p8_1p2_fraction
    - actor_mean_saturation_fraction
    - action_residual_RMS
    - gradient_norm

