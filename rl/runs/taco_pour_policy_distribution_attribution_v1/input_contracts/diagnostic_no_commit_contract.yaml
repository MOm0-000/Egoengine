schema: taco_pour_policy_distribution_attribution_v1
status: frozen_diagnostic_only_no_commit
paper_faithful: false
purpose: >-
  Attribute the already-proven training-time actuator ctrlrange information loss
  between actor mean mu and Gaussian exploration sigma without changing the
  frozen 3+1 PPO algorithm or treating this nondeterministic GPU run as
  performance evidence.

training:
  worlds: 4
  epochs: 8
  horizon_per_world_per_epoch: 40
  samples_per_epoch: 160
  total_samples: 1280
  seed: 0
  fixed_reset_endpoints: [20, 20, 20, 46]

required_trace:
  schema: taco_ppo_training_visitation_v4
  action_dimensions: 36
  required_fields:
    - sampled_action_preclamp
    - sampled_action_clamped
    - actor_mu
    - actor_sigma
    - reference_ctrl
    - requested_residual
    - effective_residual_after_ctrlrange
    - residual_lost_to_ctrlrange
  actor_sigma_semantics: standard_deviation_exp_logstd_not_variance
  extra_actor_forward_allowed: false

frozen_controls:
  objective_unchanged: true
  observation_unchanged: true
  residual_action_mapping_unchanged: true
  reward_unchanged: true
  PPO_unchanged: true
  seed_sweep_allowed: false
  scale_sweep_allowed: false
  epoch_sweep_allowed: false
  world_ratio_sweep_allowed: false

promotion:
  chunk_commit_allowed: false
  committed_boundary_output_allowed: false
  optimized_trajectory_output_allowed: false
  task_success_claim_allowed: false
  CPU_score_as_performance_comparison_allowed: false
  restore_incoming_boundary_after_diagnostic: true

required_analysis:
  - state_dependent_normalized_feasible_action_interval
  - actor_mu_outside_feasible_interval
  - Gaussian_probability_mass_outside_feasible_interval
  - observed_official_minus1_plus1_clamp_loss
  - observed_actuator_ctrlrange_loss
  - ctrlrange_loss_split_by_mu_feasible_vs_infeasible
  - anchor_vs_tail_world_split
  - outcome_endpoint_46_to_53_split

