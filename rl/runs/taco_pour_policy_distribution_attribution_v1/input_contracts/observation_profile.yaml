schema_version: 1
observation_id: taco_pour_transition_aligned_236d_v1
status: resolved_local_unpublished
paper_faithful: false
provenance: >-
  EgoEngine Section 3.2.2 publishes only the broad categories hand state,
  object pose, and retargeted reference command. The exact fields, anchor
  encoding, timestamps, contact flags, and one-step command preview below are
  local engineering choices and are not claimed as author settings.

transition:
  state_endpoint: t
  action_interval: t_to_t_plus_1
  reward_endpoint: t_plus_1

actor:
  dimension: 236
  components:
    - {name: hand_qpos, dimension: 36, timestamp: t, paper_category: hand_state}
    - {name: hand_qvel, dimension: 36, timestamp: t, paper_category: hand_state}
    - {name: fingertip_positions, dimension: 30, timestamp: t, paper_category: local_derived_hand_state}
    - {name: palm_positions, dimension: 6, timestamp: t, paper_category: local_derived_hand_state}
    - {name: current_object_anchors, dimension: 18, timestamp: t, paper_category: object_pose_local_encoding}
    - {name: goal_object_anchors, dimension: 18, timestamp: t_plus_1, paper_category: local_reference_context}
    - {name: reference_ctrl, dimension: 36, timestamp: t_plus_1, paper_category: retargeted_reference_command}
    - {name: reference_ctrl_preview, dimension: 36, timestamp: t_plus_2, paper_category: local_causal_preview}
    - {name: contact_flags, dimension: 20, timestamp: t, paper_category: local_contact_extension}
  object_order: [tool, target]
  anchor_offsets_m:
    - [0.2, 0.0, 0.0]
    - [0.0, 0.2, 0.0]
    - [0.0, 0.0, 0.2]
  measured_future_state_used: false
  future_reference_is_known_offline: true
  observation_noise_std: 0.0

critic:
  asymmetric: true
  dimension: 108
  components:
    - {name: object_linear_and_angular_velocity, dimension: 12, timestamp: t}
    - {name: hand_actuator_forces, dimension: 36, timestamp: t}
    - {name: fingertip_contact_forces, dimension: 60, timestamp: t}

decisions:
  goal_alignment: >-
    Before executing t->t+1, the policy sees the object target used to score
    the resulting endpoint t+1. The former goal=t encoding is rejected as a
    one-step timestamp mismatch.
  reference_preview: >-
    ctrl[t+2] is retained as a causal local preview because the full offline
    reference is known. It is not justified by the paper's two-chunk solver
    window and must not be described as a published EgoEngine input.
  contact_flags: >-
    Retained as a local contact-state extension. Physics contacts are current
    state measurements, not future information.
