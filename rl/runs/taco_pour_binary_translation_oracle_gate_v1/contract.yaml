schema: taco_pour_binary_translation_oracle_gate_v1
status: authorized_read_only_gate
paper_faithful: false
classification: local_engineering_oracle_shield_not_EgoEngine_RL
purpose: >-
  Test whether a threshold-free, state-dependent binary selector over only the
  right-wrist translation residual can automatically reproduce useful
  suppressions and extend the frozen actor over the complete endpoint-20 to
  endpoint-60 lookahead.

runtime:
  backend: CPU_MuJoCo_Warp
  training_allowed: false
  optimizer_steps: 0
  actor_frozen: true
  critic_frozen: true
  observation_normalization_frozen: true
  reward_changed: false
  objective_changed: false
  action_scale_changed: false
  action_bound_changed: false
  action_distribution_changed: false
  reference_timing_changed: false
  action_frame_changed: false
  PPO_hyperparameters_changed: false
  chunk_acceptance_allowed: false
  chunk_commit_allowed: false
  checkpoint_resume_for_training_allowed: false

window:
  start_endpoint: 20
  lookahead_end_endpoint: 60
  required_control_intervals: 40

candidate_actions:
  'on':
    definition: complete_frozen_deterministic_PPO_action
  'off':
    definition: complete_frozen_deterministic_PPO_action_with_only_indices_0_1_2_zeroed
    zero_normalized_action_indices: [0, 1, 2]
    semantic_group: right_wrist_translation
  scale_sweep_allowed: false
  additional_action_candidates_allowed: false

branch_semantics:
  same_pre_step_complete_physics_snapshot: true
  same_pre_forward_observation: true
  same_pre_forward_RNN_hidden: true
  actor_forward_calls_per_source: 1
  same_post_forward_RNN_hidden_for_both_physics_branches: true
  recurrent_state_intervention_allowed: false
  branch_horizon_control_intervals: 1

selection_rule:
  criterion: active_object_tracking_objective_only
  nonfinite_candidate: fail_closed_abort_audit
  contact_used: false
  source_index_used: false
  future_beyond_one_step_used: false
  rules_in_order:
    - if_exactly_one_candidate_terminates_choose_the_nonterminated_candidate
    - if_both_survive_choose_strictly_lower_next_endpoint_tracking_score
    - if_both_terminate_choose_strictly_lower_score_and_end_the_rollout_as_failed
    - if_scores_and_termination_are_exactly_equal_choose_ON
  learned_gate: false
  manually_selected_endpoints: false

required_decision_trace:
  - selected_ON_or_OFF
  - actor_raw_mu_xyz
  - actor_complete_deterministic_action
  - current_object_position_and_rotation_error
  - wrist_tool_relative_pose_and_velocity
  - reference_object_velocity
  - ON_and_OFF_next_endpoint_score_and_termination
  - ON_minus_OFF_score
  - next_endpoint_contact_as_secondary_diagnostic
  - first_failure_endpoint

preflight_regression:
  formal_Replay_exact: true
  formal_PPO_exact: true
  source45_translation_prefix_exact: true
  source50_R_forearm_ty_branch_exact: true

result_interpretation:
  forty_of_forty: >-
    oracle selector is sufficient for this window; no chunk commit and no
    learned-gate training until a separate non-lookahead architecture contract
    is approved
  above_Replay_below_forty: >-
    state-dependent translation suppression extends feasibility but another
    failure remains and must be attributed
  at_or_below_Replay: >-
    the one-step binary translation selector does not establish refinement

frozen_half_LR_candidate:
  actor_learning_rate: 5.0e-5
  remains_blocked: true

