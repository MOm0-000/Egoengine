schema: taco_pour_action_feasibility_gate_A1_v1
status: authorized_final_read_only_gate_A
paper_faithful: false
classification: local_engineering_controllability_and_structured_feedback_not_EgoEngine_RL
purpose: >-
  Close Gate A with two predeclared stages: first audit local one-step response
  using only actions already generated by Gate A0 and Gate A-rho, then, only if
  the single current-support surrogate-QP action fails exact replay, test one
  two-parameter closed-loop object position/velocity feedback controller.

runtime:
  backend: CPU_MuJoCo_Warp
  training_allowed: false
  optimizer_updates_policy: false
  actor_frozen: true
  critic_frozen: true
  observation_normalization_frozen: true
  reward_changed: false
  objective_changed: false
  reference_timing_changed: false
  action_frame_changed: false
  current_action_support_only: true
  chunk_acceptance_allowed: false
  chunk_commit_allowed: false

source_state:
  name: tail_source57
  source_endpoint: 57
  provenance: selected_tail_semantic_oracle_path_through_source56
  exact_gate_A0_state_reproduction_required: true

stage_1_local_controllability:
  new_action_search_allowed: false
  replay_saved_first_actions_only: true
  response:
    input: first_36d_world_frame_action
    output:
      - endpoint58_tool_position_delta_world_m
      - endpoint58_tool_linear_velocity_world_m_s
    interpretation: local_linear_surrogate_not_physical_Jacobian
  datasets:
    - name: current_support
      source: gate_A0_tail_source57_candidates
      candidate_count: 240
      fit_separately: true
      held_out_rule: final_CEM_iteration_of_each_restart
      response_replay_residual_clip:
        method: fixed_current_support
        value_m: 0.05
    - name: rho_le_3
      source: gate_A_rho_candidates
      candidate_count: 512
      fit_separately: true
      held_out_rule: final_CEM_iteration_of_each_restart
      response_replay_residual_clip:
        method: exactly_regenerate_float64_rho_from_parent_CEM_provenance
        equation: residual_clip_m = 0.05 * rho_float64
        validation: all_512_regenerated_rho_values_round_to_saved_float32_rho
      response_replay_clip_semantics: >-
        The parent candidate archive intentionally stores rho as float32, while
        its rollout used float64 rho. Regenerate the original float64 values
        from the hash-bound parent optimizer seeds, iteration structure, saved
        rankings, and update rule; do not infer them from rounded rho and do not
        substitute a common upper-contract clip.
  regression:
    model: affine_ridge
    fixed_ridge_coefficient: 1.0e-6
    informative_if:
      - held_out_position_RMSE_strictly_below_train_mean_baseline
      - held_out_velocity_RMSE_strictly_below_train_mean_baseline
    refit_on_all_rows_after_held_out_measurement: true
  constrained_QP:
    model_source: current_support_only
    objective: minimize_predicted_endpoint58_tool_position_error_L2
    solver: scipy_optimize_lsq_linear_box_constrained
    bounds: exact_current_state_feasible_36d_action_bounds
    exact_simulator_validation_actions: 1
    exact_pass_if: endpoint58_objective_score_strictly_below_1
    if_exact_passes: close_Gate_A_positive_and_skip_stage_2

stage_2_structured_feedback:
  execute_only_if_stage_1_QP_exact_replay_fails: true
  state_entry: selected_tail_semantic_oracle_path_through_source56
  feedback_applies_sources: [57, 58, 59]
  frozen_actor_forward_each_step: true
  nontranslation_actor_action_unchanged_before_state_feasible_projection: true
  equation: delta_p_obj = kp * (p_ref_t_plus_1 - p_t) + kv * (v_ref_t_plus_1 - v_t)
  translation_action: frozen_PPO_translation_plus_delta_p_obj_divided_by_0.05
  state_feasible_projection: true
  residual_scale_m: 0.05
  gains:
    shared_across_xyz_and_all_three_steps: true
    kp_interval: [0.0, 1.0]
    kp_interval_provenance: no_position_feedback_to_full_current_position_lag_cancellation
    kv_interval_seconds: [0.0, 0.03333333333333333]
    kv_interval_provenance: no_velocity_feedback_to_one_30Hz_control_interval
  optimizer:
    algorithm: deterministic_two_parameter_CEM
    population: 16
    elites: 4
    iterations: 6
    restarts:
      - {name: no_feedback_centered, seed: 58101, initial_kp: 0.0, initial_kv_seconds: 0.0}
      - {name: one_step_cancellation_centered, seed: 58102, initial_kp: 1.0, initial_kv_seconds: 0.03333333333333333}
    initial_normalized_standard_deviation: 0.6
    elite_update_new_weight: 0.75
    minimum_normalized_standard_deviation: 0.04
    injected_candidates_each_iteration:
      - current_CEM_mean
      - no_feedback
      - full_position_plus_one_step_velocity_feedback
    stop_on_first_feasible: false
    candidate_count: 192
    ranking_lexicographic:
      - nonfinite_endpoint_count
      - tracking_boundary_violation_count
      - maximum_objective_score
      - sum_objective_score
      - normalized_gain_norm_tie_break_only
  primary_gate:
    feasible_if:
      - endpoint58_score_strictly_below_1
      - endpoint59_score_strictly_below_1
      - endpoint60_score_strictly_below_1

decision_rule:
  if_stage_1_exact_QP_passes:
    gate_A_classification: current_raw_36d_interface_has_demonstrated_one_step_authority
    gate_B_observation_sufficiency_read_only_allowed: true
  if_stage_1_fails_and_stage_2_passes:
    gate_A_classification: structured_object_motion_feedback_demonstrates_three_step_feasibility
    gate_B_observation_sufficiency_read_only_allowed: true
  if_both_fail:
    gate_A_classification: >-
      tested_raw_surrogate_QP_and_structured_feedback_candidates_do_not_demonstrate
      source57_feasibility
    gate_B_observation_sufficiency_read_only_allowed: false
    next_direction: low_level_impedance_or_force_aware_contact_controllability
  finite_search_failure_is_mathematical_infeasibility_proof: false

stopping_rule:
  Gate_A_closes_after_this_contract: true
  additional_axis_gain_frame_rho_or_per_source_search_allowed: false
  pure_learned_suppression_gate_training_allowed: false
  half_actor_learning_rate_training_allowed: false
  policy_training_allowed: false
  chunk_commit_allowed: false

