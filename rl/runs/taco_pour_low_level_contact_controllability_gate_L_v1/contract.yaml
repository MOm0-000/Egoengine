schema: taco_pour_low_level_contact_controllability_gate_L_v1
status: authorized_finite_read_only_gate_L
paper_faithful: false
classification: local_engineering_low_level_contact_controllability_not_EgoEngine_parameter_recovery
purpose: >-
  Compare the same two frozen high-level source57 command sequences under an
  explicit, URDF-effort-limited impedance execution layer. Run the single
  force-aware extension only if impedance alone fails. This contract closes
  Gate L and does not authorize policy training or chunk promotion.

runtime:
  backend: CPU_MuJoCo_Warp
  source_state: exact_tail_source57_snapshot
  source_state_provenance: selected_tail_semantic_oracle_path_through_source56
  high_level_command_search_allowed: false
  policy_training_allowed: false
  optimizer_updates_policy: false
  reward_changed: false
  objective_changed: false
  reference_timing_changed: false
  action_frame_changed: false
  contact_model_changed: false
  chunk_acceptance_allowed: false
  chunk_commit_allowed: false

actuator_model:
  formal: affine_position_target_actuators
  diagnostic: explicit_generalized_force_joint_coordinate_impedance_on_the_unchanged_formal_model
  execution: >-
    neutralize each formal position target at the live qpos, preserve its exact
    compiled velocity damping, and apply the remaining bounded generalized
    force through qfrc_applied on only the 36 actuated hand DOFs
  gains:
    source: exact_compiled_formal_affine_force_law
    equation: tau_i = gain_i * target_i + bias_position_i * q_i + bias_velocity_i * qdot_i
    task_tuned: false
  effort_limits:
    source: hash_bound_XHand_6dof_URDF_joint_effort
    wrist_translation_units: N
    wrist_rotation_and_finger_units: Nm
    limit_sweep_allowed: false

free_space_equivalence:
  scene: formal_scene_with_explicit_contact_pairs_removed
  initial_hand_qpos: midpoint_of_each_actuated_joint_range
  initial_qvel: zero
  step_amplitude: 0.1_times_effort_limit_divided_by_compiled_kp
  directions: [-1, 1]
  actuators: all_36
  physics_substeps: 10
  response_fit_or_gain_search_allowed: false
  interpretation: >-
    exact force-law extraction validated by same-model small-step response;
    this is not task gain fitting and introduces no alternate MJCF actuator model
  acceptance:
    no_effort_saturation: true
    max_qpos_difference: 1.0e-5
    max_qvel_difference: 1.0e-3

high_level_anchors:
  entries:
    - name: formal_frozen_PPO
      source: recomputed_from_exact_source57_state_and_hidden_under_formal_position_scene
      fixed_open_loop_actions_for_diagnostic_scene: true
    - name: gate_A1_best_position_velocity_feedback
      source: hash_bound_gate_A1_structured_feedback_best_actions
      fixed_open_loop_actions_for_diagnostic_scene: true
  sources: [57, 58, 59]

L0_impedance_equivalent:
  execute: true
  controller: effort_limited_joint_coordinate_impedance
  substep_feedback: true
  task_gain_sweep_allowed: false
  pass_if_for_one_anchor:
    - endpoint58_score_strictly_below_1
    - endpoint59_score_strictly_below_1
    - endpoint60_score_strictly_below_1
    - every_force_or_torque_command_within_URDF_limit

L1_force_aware_impedance:
  execute_only_if_L0_has_no_passing_anchor: true
  contact: right_pinky_to_tool
  force_target: measured_source57_live_normal_force
  normal: current_live_contact_normal_or_zero_correction_when_contact_absent
  probe:
    anchor: formal_frozen_PPO
    displacement_m: 0.0001
    directions: [-1, 1]
    physics_substeps: 1
    derivative: centered_difference_dFn_dxn
    minimum_identifiable_abs_dFn_dxn_N_per_m: 1.0
  gain:
    equation: kf = compiled_right_wrist_translation_kp / abs(dFn_dxn)
    pressing_direction: probe_sign_times_current_live_contact_normal
    task_tuned: false
    gain_sweep_allowed: false
  force_equation: Fcmd = Kp_ex + Kd_ev + kf_times_Fstar_minus_Fn_times_n
  pass_if_for_one_anchor:
    - endpoint58_score_strictly_below_1
    - endpoint59_score_strictly_below_1
    - endpoint60_score_strictly_below_1
    - every_force_or_torque_command_within_URDF_limit

decision_rule:
  if_L0_passes: freeze_impedance_candidate_and_require_separate_minimal_Gate_A_revalidation
  if_L0_fails_and_L1_passes: explicit_contact_force_layer_candidate_required
  if_both_fail: >-
    low_level_contact_controllability_not_demonstrated_under_the_two_predeclared_controllers;
    keep_RL_gates_closed_and_review_physics_reference_and_XHand_actuation
  finite_negative_result_is_mathematical_infeasibility_proof: false

stopping_rule:
  Gate_L_closes_after_L0_and_conditional_L1: true
  additional_controller_gain_contact_force_axis_frame_or_per_source_sweep_allowed: false
  Gate_B_allowed_before_Gate_L_positive: false
  Gate_C_allowed_before_Gate_L_positive: false
  Gate_D_allowed_before_Gate_L_positive: false
  actor_learning_rate_5e_minus_5_allowed: false
  learned_gate_allowed: false
  reward_change_allowed: false
  PPO_retraining_allowed: false
  chunk_commit_allowed: false

