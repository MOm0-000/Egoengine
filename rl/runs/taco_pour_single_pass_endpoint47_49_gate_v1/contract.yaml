schema: taco_pour_single_pass_endpoint47_49_gate_v1
status: authorized_read_only_gate
paper_faithful: false
purpose: >-
  Before authorizing another fresh PPO run, verify that the new single-pass
  policy's endpoint-48 divergence is locally mitigated when exactly one
  source-47 or source-48 PPO residual is replaced by the Replay-equivalent
  zero residual. This gate does not train, tune, accept or commit a chunk.

runtime:
  backend: CPU_MuJoCo_Warp
  training_allowed: false
  optimizer_steps: 0
  actor_frozen: true
  critic_frozen: true
  observation_normalization_frozen: true
  reward_changed: false
  objective_changed: false
  action_bound_changed: false
  action_distribution_changed: false
  reference_timing_changed: false
  action_frame_changed: false
  PPO_hyperparameters_changed: false
  chunk_acceptance_allowed: false
  chunk_commit_allowed: false
  checkpoint_resume_for_training_allowed: false

aligned_attribution:
  source_endpoints: [46, 47, 48]
  state_and_outcome_endpoints: [46, 47, 48, 49]
  fields:
    - tool_position_error_xyz
    - tool_rotation_error
    - normalized_ellipse_score
    - contact_flags
    - named_36d_residual
    - deterministic_action_saturation

counterfactual:
  source_endpoints: [47, 48]
  intervention_control_steps: 1
  intervention: replace_full_36d_PPO_residual_with_zero
  replay_equivalence: Replay uses the same reference base command and zero residual
  continuation: frozen_deterministic_PPO
  rollout_end_endpoint: 60
  no_policy_retraining: true
  no_local_gradient_claim: true

candidate_evidence_gate:
  per_source_requirements:
    - restored formal PPO suffix is bitwise identical before intervention
    - intervention does not terminate earlier than formal PPO
    - endpoint_49_score_is_strictly_lower_than_formal_PPO
  joint_requirement: at_least_one_intervention_survives_endpoint_49
  numeric_improvement_threshold_invented: false
  passing_effect: candidate_may_be_marked_awaiting_explicit_training_authorization
  failing_effect: actor_learning_rate_candidate_remains_blocked
  training_automatically_authorized: false

frozen_next_candidate:
  sole_future_change: actor_learning_rate
  baseline: 0.0001
  candidate: 0.00005
  actor_mini_epochs: 1
  approximate_KL_basis:
    observed_maximum_post_optimizer_fixed_probe_exact_KL_mean: 0.039736180923459874
    local_quadratic_step_scaling: 0.25
    approximate_candidate_KL: 0.009934045230864968
  paper_parameter_recovery_claimed: false
  fresh_training_authorized: false

