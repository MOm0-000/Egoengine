schema: taco_pour_simulator_contract_adjudication_gate_Q_v1
status: authorized_final_finite_simulator_contract_adjudication
paper_faithful: false
classification: local_engineering_simulator_contract_adjudication_not_author_parameter_recovery
purpose: >-
  Distinguish intrinsic formal-actuator demand from clipping-induced divergence,
  determine whether one predeclared collision representation yields an acceptable
  native-MuJoCo/CPU-MJWP contract, and re-evaluate reference wrench feasibility
  using the complete unique contact graph. Gate Q is the final physics gate.

runtime:
  training_allowed: false
  optimizer_updates_policy: false
  new_controller_allowed: false
  action_or_controller_search_allowed: false
  mass_friction_effort_gain_axis_frame_or_source_sweep_allowed: false
  reward_objective_reference_or_actuator_change_allowed: false
  chunk_acceptance_allowed: false
  chunk_commit_allowed: false
  order: [Q1, Q2, Q3]

Q1_formal_actuator_demand:
  backend: CPU_MuJoCo_Warp
  actuator_model: unmodified_formal_unlimited_affine_position_actuator
  paths:
    - Replay_zero_residual
    - frozen_single_pass_PPO
    - frozen_binary_prefix_plus_tail_semantic_oracle
  endpoints: [20, 60]
  focus_endpoints: [44, 60]
  physics_substeps_per_control_interval: 10
  record:
    - compiled_actuator_force
    - position_component_Kp_times_ctrl_minus_q
    - damping_component_minus_Kd_times_qdot
    - requested_sum
    - requested_and_compiled_force_over_declared_URDF_effort
  continuation_after_local_tracking_termination: diagnostic_only
  effort_or_policy_change_allowed: false

Q2_collision_backend_contract:
  sources: [45, 50, 57]
  physics_substeps: 10
  variants:
    current_mixed:
      keep_current_contact_pairs: true
    convex_only:
      remove_pairs_containing_external_exact_geom: true
    external_exact_SDF_only:
      remove_hand_object_pairs_not_containing_external_exact_geom: true
  frozen_across_variants:
    - mass
    - friction
    - actuators
    - qpos
    - qvel
    - ctrl
    - qacc_warmstart
  parity_conditions_identical_to_Gate_P: true
  duplicate_patch_thresholds_identical_to_Gate_P: true
  freeze_condition:
    - source45_exact_live_hand_tool_pair_set_matches_all_substeps
    - all_three_sources_pass_Gate_P_parity
    - visual_surface_patch_duplicate_count_is_lower_than_current_mixed
  if_no_variant_passes: acknowledge_backend_dependent_physics_and_stop_parity_search

Q3_complete_contact_reference_wrench:
  endpoints: [44, 60]
  geometry_backend: native_MuJoCo_on_Q2_selected_variant_or_current_mixed_if_none_selected
  required_wrench: MuJoCo_inverse_dynamics_free_joint_generalized_force
  hand_candidates:
    sides: [right, left]
    samples: all_declared_fingertip_palm_and_collision_geom_surface_samples
    residual_reachability: first_order_point_Jacobian_box_support
  passive_candidates:
    - tool_target_contacts_present_at_reference_geometry
    - tool_floor_contacts_present_at_reference_geometry
  unique_patch_clustering:
    maximum_contact_point_separation_m: 0.0005
    maximum_contact_normal_angle_deg: 5.0
    keep_distinct_counterpart_bodies: true
  compiled_contact_semantics:
    cone: must_match_compiled_MuJoCo_option
    condim: per_contact
    friction: per_contact_or_explicit_pair
    artificial_16_sided_cone_forbidden: true
  constraints:
    - nonnegative_pyramidal_contact_coefficients
    - both_hands_abs_J_transpose_f_le_declared_effort_limits
    - passive_tool_target_and_tool_floor_contacts_have_no_hand_effort_cost
  physics_parameter_sweep_allowed: false

decision:
  reopen_Gate_B_C_only_if:
    - Q2_freezes_one_unique_collision_backend_contract
    - Q3_all_endpoints_feasible_under_current_formal_physics
  otherwise:
    exact_EgoEngine_reproduction_status: blocked_pending_unpublished_simulator_contact_actuation_object_physics_and_objective_details
    inspired_engineering_reproduction_requires_separate_future_authorization: true

stopping_rule:
  Gate_Q_is_final_physics_gate: true
  additional_physics_gate_allowed: false
  additional_backend_parity_search_allowed: false
  additional_source_action_controller_or_contact_sweep_allowed: false
  Gate_B_C_allowed_before_Q2_and_Q3_positive: false
  PPO_retraining_allowed: false
  actor_learning_rate_5e_minus_5_allowed: false
  learned_gate_allowed: false
  reward_change_allowed: false
  chunk_commit_allowed: false

